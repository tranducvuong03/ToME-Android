plugins {
    id "com.android.application"
}

def engineRoot = file("../..")
def generatedAssets = layout.buildDirectory.dir("generated/te4Assets")

android {
    namespace "org.libsdl.app"
    compileSdk 35

    defaultConfig {
        applicationId "org.te4.android"
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName "1.7.6"
        ndk {
            abiFilters "arm64-v8a"
        }
        externalNativeBuild {
            cmake {
                targets "main"
                arguments "-DTE4_ROOT=${engineRoot.absolutePath}",
                    "-DSDL2_SOURCE_DIR=${file('../SDL').absolutePath}"
                cppFlags "-std=c++11"
            }
        }
    }

    sourceSets {
        main {
            java.srcDir("../SDL/android-project/app/src/main/java")
            res.srcDir("../SDL/android-project/app/src/main/res")
            assets.srcDir(generatedAssets)
        }
    }

    externalNativeBuild {
        cmake {
            path "../CMakeLists.txt"
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

tasks.register("stageEngineAssets", Sync) {
    from(new File(engineRoot, "bootstrap")) {
        into "bootstrap"
    }
    from(new File(engineRoot, "game")) {
        into "game"
    }
    into generatedAssets
}

tasks.configureEach {
    if (name.startsWith("merge") && name.endsWith("Assets")) {
        dependsOn(tasks.named("stageEngineAssets"))
    }
}
