name: Android

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "src/**"
      - "game/**"
      - "bootstrap/**"
      - ".github/workflows/android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.1.13356709" "cmake;3.22.1"

      - name: Fetch SDL Android project
        run: |
          git clone --depth 1 --branch release-2.30.11 https://github.com/libsdl-org/SDL.git android/SDL

      - name: Install Gradle
        run: |
          curl --fail --location --retry 3 https://services.gradle.org/distributions/gradle-8.7-bin.zip --output "$RUNNER_TEMP/gradle.zip"
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Build arm64 APK
        working-directory: android
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Symbolize reported native crash
        run: |
          so=$(find android/app/.cxx -name libmain.so -path '*arm64-v8a*' -print -quit)
          test -n "$so"
          addr2line=$(find "$ANDROID_HOME/ndk" -name llvm-addr2line -print -quit)
          test -n "$addr2line"
          "$addr2line" -C -f -e "$so" \
            0x2e485c 0x2e4274 0x2e3858 0x2e36ec

      - name: Verify APK
        run: |
          apk=$(find android/app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$apk"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          echo "APK: $apk"

      - uses: actions/upload-artifact@v4
        with:
          name: tome-android-arm64
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
